# Docker Compose for Windows/macOS Docker Desktop
# Uses port publishing instead of host networking

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hieunghi-voice-backend
    ports:
      - "7860:7860"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HOST=0.0.0.0
      - PORT=7860
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hieunghi-voice-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      - backend
    restart: unless-stopped
